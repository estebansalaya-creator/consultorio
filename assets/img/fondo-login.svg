<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Fondo de la pantalla de ingreso: pulso (ECG), estetoscopio, cruces y molécula, en líneas suaves sobre el azul marino -->
  <defs>
    <pattern id="puntos" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.3" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <linearGradient id="pulso" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fd6c9" stop-opacity="0"/>
      <stop offset=".18" stop-color="#6fd6c9" stop-opacity=".55"/>
      <stop offset=".82" stop-color="#6fd6c9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6fd6c9" stop-opacity="0"/>
    </linearGradient>
    <filter id="brillo" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <radialGradient id="desvanecer" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <mask id="mascara"><rect width="1600" height="1000" fill="url(#desvanecer)"/></mask>
  </defs>

  <rect width="1600" height="1000" fill="url(#puntos)" mask="url(#mascara)"/>

  <!-- Cruz grande (arriba a la derecha) -->
  <g fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".09" stroke-width="2" stroke-linejoin="round">
    <path d="M1265 60h110v115h115v110h-115v115h-110v-115h-115v-110h115z"/>
    <path d="M1291 86h58v115h115v58h-115v115h-58v-115h-115v-58h115z" fill="none" stroke-opacity=".05"/>
  </g>

  <!-- Cruces chicas -->
  <g fill="#6fd6c9" fill-opacity=".18">
    <path d="M884 96h16v24h24v16h-24v24h-16v-24h-24v-16h24z"/>
    <path d="M1508 590h12v18h18v12h-18v18h-12v-18h-18v-12h18z"/>
    <path d="M86 452h10v15h15v10h-15v15h-10v-15h-15v-10h15z"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2">
    <path d="M640 840h22v33h33v22h-33v33h-22v-33h-33v-22h33z"/>
  </g>

  <!-- Molécula (arriba a la izquierda) -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="2" stroke-linejoin="round">
    <path d="M200 140l52 30v60l-52 30-52-30v-60z"/>
    <path d="M304 140l52 30v60l-52 30-52-30v-60z"/>
    <path d="M252 230l52 30v60l-52 30-52-30v-60z"/>
    <path d="M356 170l70-40M148 170l-60-34M252 350v62"/>
  </g>
  <g fill="#6fd6c9" fill-opacity=".3">
    <circle cx="426" cy="130" r="7"/><circle cx="88" cy="136" r="6"/><circle cx="252" cy="412" r="6"/>
  </g>

  <!-- Pulso (ECG) a la altura del formulario -->
  <path id="ecg" d="M0 520H300l16-12 14 12h60l12-8 10 8h34l14 34 24-190 26 236 16-92h52l20-28 28 28H800l16-12 14 12h60l12-8 10 8h34l14 34 24-190 26 236 16-92h52l20-28 28 28H1600"
        fill="none" stroke="#6fd6c9" stroke-opacity=".35" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" filter="url(#brillo)"/>
  <path d="M0 520H300l16-12 14 12h60l12-8 10 8h34l14 34 24-190 26 236 16-92h52l20-28 28 28H800l16-12 14 12h60l12-8 10 8h34l14 34 24-190 26 236 16-92h52l20-28 28 28H1600"
        fill="none" stroke="url(#pulso)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Estetoscopio (abajo a la izquierda) -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 640c-14 0-20 10-20 24v40c0 60 40 100 96 104"/>
    <path d="M330 640c14 0 20 10 20 24v40c0 60-40 100-96 104"/>
    <path d="M253 808c0 70 18 130 90 140 70 10 110-40 120-104"/>
    <circle cx="465" cy="800" r="40"/>
  </g>
  <g fill="#ffffff" fill-opacity=".14">
    <circle cx="176" cy="640" r="9"/><circle cx="330" cy="640" r="9"/>
  </g>
  <circle cx="465" cy="800" r="20" fill="#6fd6c9" fill-opacity=".14"/>

  <!-- Cápsula (abajo a la derecha) -->
  <g transform="rotate(-35 1330 830)" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2.5">
    <rect x="1250" y="802" width="160" height="56" rx="28"/>
    <path d="M1330 802v56"/>
  </g>
  <g transform="rotate(-35 1330 830)">
    <path d="M1330 802h52a28 28 0 0 1 0 56h-52z" fill="#6fd6c9" fill-opacity=".1"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
